<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz บทที่ 2 - เครือข่ายคอมพิวเตอร์</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <section id="start-screen" class="card">
      <p class="eyebrow">QUIZ SYSTEM</p>
      <h1>แบบทดสอบบทที่ 2</h1>
      <p>เรื่อง TCP/IP และแบบจำลอง OSI</p>
      <p class="muted">มีข้อสอบ 20 ข้อ เลือกคำตอบที่ถูกต้องที่สุด</p>
      <label for="name-input">ชื่อผู้สอบ</label>
      <input id="name-input" type="text" placeholder="กรอกชื่อของคุณ" autocomplete="name">
      <button id="start-btn">เริ่มทำข้อสอบ</button>
      <p id="start-error" class="error"></p>
    </section>

    <section id="quiz-screen" class="card hidden">
      <div class="topbar">
        <span id="progress"></span>
        <span id="timer">เวลา 00:00</span>
      </div>
      <div class="progress-track"><div id="progress-fill"></div></div>
      <h2 id="question"></h2>
      <div id="choices" class="choices"></div>
      <div class="actions">
        <button id="prev-btn" class="secondary">ย้อนกลับ</button>
        <button id="next-btn" disabled>ข้อถัดไป</button>
      </div>
      <p class="muted small">เลือกคำตอบก่อนกดข้อถัดไป สามารถย้อนกลับไปแก้คำตอบได้</p>
    </section>

    <section id="result-screen" class="card hidden">
      <p class="eyebrow">RESULT</p>
      <h1>ผลการสอบ</h1>
      <p id="result-name"></p>
      <div class="score-circle"><strong id="result-score"></strong><span>คะแนน</span></div>
      <p id="result-percent" class="result-percent"></p>
      <p id="result-time" class="muted"></p>
      <button id="restart-btn">กลับไปหน้าเริ่มต้น</button>
      <p id="save-status" class="muted small"></p>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
